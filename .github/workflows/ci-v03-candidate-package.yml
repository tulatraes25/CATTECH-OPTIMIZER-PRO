name: CATTECH v0.3 Candidate Package QA (PR Only)

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Packaging is read-only: Actions artifact only; no tags, merges or Releases.
# Do not run for arbitrary forks or old stacked PRs.
concurrency:
  group: candidate-v03-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  candidate-package:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/v0.3-certification-20261016' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-package.yml
    with:
      version: "0.3.0"
      source_ref: ${{ github.event.pull_request.head.sha }}

  verify-candidate:
    name: Verify archived candidate on independent Ubuntu runner
    needs: candidate-package
    if: ${{ needs.candidate-package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PACKAGED_SOURCE_SHA: ${{ needs.candidate-package.outputs.source_sha }}
      PACKAGED_PRODUCT_VERSION: ${{ needs.candidate-package.outputs.product_version }}
      PACKAGED_FILE_VERSION: ${{ needs.candidate-package.outputs.file_version }}
      PACKAGED_ZIP_SHA256: ${{ needs.candidate-package.outputs.sha256 }}
      PACKAGED_ZIP_NAME: ${{ needs.candidate-package.outputs.zip_name }}
      PACKAGED_CHECKSUM_NAME: ${{ needs.candidate-package.outputs.checksum_name }}
    steps:
      - name: Download exact same-run candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate-package.outputs.artifact_name }}
          path: candidate

      - name: Verify provenance, two SHA-256 sources, ZIP integrity and safety
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid immutable source SHA"
          [[ "$PACKAGED_SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]] || fail "Package source SHA differs from PR head"
          [[ "$PACKAGED_PRODUCT_VERSION" == "0.3.0+$EXPECTED_SOURCE_SHA" ]] || fail "EXE ProductVersion provenance mismatch"
          [[ "$PACKAGED_FILE_VERSION" == "0.3.0.0" ]] || fail "EXE FileVersion mismatch"
          [[ "$PACKAGED_ZIP_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || fail "Missing/invalid upstream ZIP digest"
          [[ "$PACKAGED_ZIP_NAME" == "CATTECH-Optimizer-Pro-v0.3.0-win-x64.zip" ]] || fail "Unexpected ZIP filename"
          [[ "$PACKAGED_CHECKSUM_NAME" == "CATTECH-Optimizer-Pro-v0.3.0-win-x64.sha256.txt" ]] || fail "Unexpected checksum filename"

          zip="candidate/$PACKAGED_ZIP_NAME"
          manifest="candidate/$PACKAGED_CHECKSUM_NAME"
          [[ -f "$zip" && -f "$manifest" ]] || fail "Candidate ZIP or checksum manifest absent"
          [[ "$(wc -l < "$manifest")" -eq 1 ]] || fail "Checksum manifest must contain exactly one line"
          read -r listed_hash listed_name < "$manifest"
          [[ "$listed_name" == "$PACKAGED_ZIP_NAME" ]] || fail "Checksum manifest names wrong ZIP"
          [[ "$listed_hash" =~ ^[0-9A-Fa-f]{64}$ ]] || fail "Malformed checksum manifest"
          recalculated=$(sha256sum "$zip" | awk '{print $1}')
          upstream=$(printf '%s' "$PACKAGED_ZIP_SHA256" | tr '[:lower:]' '[:upper:]')
          declared=$(printf '%s' "$listed_hash" | tr '[:lower:]' '[:upper:]')
          actual=$(printf '%s' "$recalculated" | tr '[:lower:]' '[:upper:]')
          [[ "$upstream" == "$declared" && "$declared" == "$actual" ]] || fail "Three-way ZIP SHA-256 mismatch"
          unzip -tqq "$zip" || fail "ZIP archive CRC/integrity check failed"

          entries="$RUNNER_TEMP/cattech-candidate-entries.txt"
          unzip -Z1 "$zip" > "$entries" || fail "Cannot enumerate ZIP members"
          shopt -s nocasematch
          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..|./*|*/./*) fail "Unsafe ZIP entry path" ;;
              data/*|logs/*|backups/*|reports/*) fail "Personal/runtime directory included" ;;
              *smartctl.exe) fail "Unlicensed bundled smartctl detected" ;;
            esac
          done < "$entries"
          for required in \
            "Cattech.Optimizer.Pro.UI.exe" \
            "Cattech.Optimizer.Pro.UI.runtimeconfig.json" \
            "LibreHardwareMonitorLib.dll" \
            "config/herramientas.json" \
            "config/bugcheckcodes.json" "README.md" "LICENSE"; do
            grep -Fxq -- "$required" "$entries" || fail "Required ZIP file is missing"
          done
          unzip -p "$zip" "Cattech.Optimizer.Pro.UI.runtimeconfig.json" |
            jq -e '.runtimeOptions.tfm == "net10.0"' >/dev/null ||
            fail "Candidate is not targeting the audited .NET 10 runtime"
          {
            echo "## CATTECH candidate — independent archive verification"
            echo ""
            echo "| Field | Result |"
            echo "|---|---|"
            echo "| Source SHA | $EXPECTED_SOURCE_SHA |"
            echo "| ProductVersion | $PACKAGED_PRODUCT_VERSION |"
            echo "| FileVersion | $PACKAGED_FILE_VERSION |"
            echo "| SHA-256 (three independent readings) | $actual |"
            echo "| ZIP CRC / mandatory files / runtimeconfig .NET 10 | PASS |"
            echo "| Forbidden personal directories and bundled smartctl | ABSENT |"
            echo "| GitHub tag / public release | NOT CREATED |"
          } >> "$GITHUB_STEP_SUMMARY"

