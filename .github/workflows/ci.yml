name: CATTECH CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Cattech.Optimizer.Pro.sln

      - name: Build Release
        run: dotnet build src/Cattech.Optimizer.Pro.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test src/Cattech.Optimizer.Pro.sln --configuration Release --no-build --logger "trx;LogFileName=cattech-ci.trx" --results-directory "${{ github.workspace }}\TestResults"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cattech-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
