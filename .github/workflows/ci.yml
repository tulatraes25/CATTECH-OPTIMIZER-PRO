name: CATTECH CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit release workflow input boundaries
        shell: pwsh
        run: ./scripts/qa/Test-WorkflowDispatchScriptInputs.ps1

      - name: Test release preflight inputs (synthetic, no dispatch)
        shell: pwsh
        run: ./scripts/qa/Test-ReleasePreflightInputs.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Cattech.Optimizer.Pro.sln

      - name: Build Release
        run: dotnet build src/Cattech.Optimizer.Pro.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test src/Cattech.Optimizer.Pro.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=cattech-ci.trx" --results-directory "${{ github.workspace }}\TestResults"

      - name: Coverage Summary (non-gating baseline)
        shell: pwsh
        run: |
          $resultsDir = Join-Path $env:GITHUB_WORKSPACE "TestResults"
          $reports = @(Get-ChildItem -LiteralPath $resultsDir -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Name -eq "coverage.cobertura.xml" })
          Write-Host "Cobertura reports found: $($reports.Count)"
          if ($reports.Count -lt 1) {
            $names = @(Get-ChildItem -LiteralPath $resultsDir -Recurse -File |
              Select-Object -ExpandProperty Name)
            Write-Host "Test output files: $($names -join ', ')"
            throw "Missing Cobertura coverage report."
          }
          $index = 0
          foreach ($reportFile in $reports) {
            $index++
            [xml]$coverageXml = Get-Content -LiteralPath $reportFile.FullName -Raw
            if ($null -eq $coverageXml.coverage) {
              throw "Invalid Cobertura document structure."
            }
            $lineRate = [double]::Parse($coverageXml.coverage.GetAttribute("line-rate"), [System.Globalization.CultureInfo]::InvariantCulture)
            $branchRate = [double]::Parse($coverageXml.coverage.GetAttribute("branch-rate"), [System.Globalization.CultureInfo]::InvariantCulture)
            $lines = [math]::Round($lineRate * 100, 2)
            $branches = [math]::Round($branchRate * 100, 2)
            $summary = "CATTECH coverage report $index (unmerged test assembly): **$lines% lines**, **$branches% branches**. Not physical hardware or WPF UI certification."
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
            Write-Host $summary
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cattech-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14
